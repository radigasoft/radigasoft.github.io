<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Al-Qur'an Digital - DigitalUmmah</title>
  <style>
    :root {
      --bg-dark: #051619;
      --bg-mid: #082026;
      --bg-glow: #0d2f36;
      --card-bg: #082026;
      --border-soft: #1a4750;
      --border-hover: rgba(232, 182, 56, 0.72);
      --gold: #e8b638;
      --teal: #2b8a85;
      --text-main: #f3f7f7;
      --text-muted: #96b2b4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-mid);
      background-image:
        radial-gradient(circle at 30% 25%, var(--bg-glow) 0%, var(--bg-mid) 52%, var(--bg-dark) 100%);
      color: var(--text-main);
      padding: 28px 24px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-wrap {
      width: 100%;
      max-width: 1040px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-main);
      background-color: var(--card-bg);
      border: 1px solid var(--border-soft);
      padding: 9px 15px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 600;
      transform: translateY(0);
      box-shadow: 0 0 0 rgba(232, 182, 56, 0);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .back-link:hover {
      background-color: var(--card-bg);
      transform: translateY(-2px);
      border-color: var(--border-hover);
      box-shadow: 0 0 0 1px rgba(232, 182, 56, 0.2),
                  0 6px 18px rgba(232, 182, 56, 0.1);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 24px;
      transform: translateY(0);
      box-shadow: 0 0 0 rgba(232, 182, 56, 0);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.28s ease,
                  box-shadow 0.28s ease;
    }

    .card:hover {
      background-color: var(--card-bg);
      transform: translateY(-3px);
      border-color: var(--border-hover);
      box-shadow: 0 0 0 1px rgba(232, 182, 56, 0.22),
                  0 8px 24px rgba(232, 182, 56, 0.12);
    }

    .hero-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .hero-left {
      display: flex;
      align-items: center;
      gap: 20px;
      max-width: 680px;
    }

    .hero-icon-frame {
      display: block;
      width: fit-content;
      flex-shrink: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-soft);
      line-height: 0;
    }

    .hero-icon-frame img {
      display: block;
      width: auto;
      height: auto;
      max-width: 120px;
    }

    h1 {
      font-size: 26px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .lead {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .download-btn {
      display: inline-block;
      text-decoration: none;
      background-color: var(--gold);
      color: #082026;
      font-size: 14px;
      font-weight: 700;
      padding: 11px 20px;
      border-radius: 9px;
      transition: filter 0.25s ease;
    }

    .download-btn:hover {
      filter: brightness(1.07);
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .video-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-soft);
      background-color: #051619;
    }

    .video-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .ss-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .ss-item {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-soft);
      background-color: #051619;
    }

    .ss-item img {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 860px) {
      .media-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .hero-left {
        flex-direction: column;
        align-items: flex-start;
      }

      .ss-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="top-bar">
      <a href="index.html" class="back-link">← Kembali ke DigitalUmmah</a>
    </div>

    <section class="card hero-box">
      <div class="hero-left">
        <div class="hero-icon-frame">
          <img src="LogoAlquran.jpg" alt="Al-Qur'an Digital">
        </div>
        <div>
          <h1>Al-Qur'an Digital</h1>
          <p class="lead">
            Aplikasi desktop bacaan per surah, terjemahan, catatan kaki, dan bookmark cepat karya RadigaSoft.
          </p>
        </div>
      </div>

      <a href="#" class="download-btn">Download Installer / EXE</a>
    </section>

    <div class="media-grid">
      <section class="card">
        <div class="section-title">Video Preview YouTube</div>
        <div class="video-box">
          <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            title="Preview Al-Qur'an Digital"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
      </section>

      <section class="card">
        <div class="section-title">Screenshot Aplikasi</div>
        <div class="ss-grid">
          <div class="ss-item">
            <img src="ss-quran-1.jpg" alt="Screenshot Al-Qur'an 1">
          </div>
          <div class="ss-item">
            <img src="ss-quran-2.jpg" alt="Screenshot Al-Qur'an 2">
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
