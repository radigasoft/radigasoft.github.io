<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigitalUmmah - Portal Software Muslim Modern</title>
  <style>
    :root {
      --bg-dark: #071b1d;
      --bg-mid: #0c2b2e;
      --bg-glow: #113a3e;
      --card-bg: rgba(10, 36, 39, 0.72);
      --card-hover: rgba(15, 49, 53, 0.92);
      --border-soft: rgba(52, 138, 134, 0.28);
      --gold: #e8b638;
      --teal: #2b8a85;
      --text-main: #f3f7f7;
      --text-muted: #96b2b4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 22% 50%, var(--bg-glow) 0%, var(--bg-mid) 42%, var(--bg-dark) 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 36px 24px;
    }

    .hub-container {
      width: 100%;
      max-width: 1040px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    /* PANEL KIRI */
    .brand-panel {
      width: 340px;
      flex-shrink: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(3, 12, 13, 0.55);
    }

    .brand-logo-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: #092023;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .brand-title {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }

    .brand-title .gold {
      color: var(--gold);
    }

    .brand-title .white {
      color: #ffffff;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* CABANG TENGAH */
    .branch-connector {
      width: 84px;
      height: 220px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .branch-connector svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* PANEL KANAN */
    .apps-panel {
      flex: 1;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .app-card {
      display: flex;
      align-items: center;
      gap: 22px;
      background: var(--card-bg);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 18px 22px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 12px 30px rgba(3, 12, 13, 0.45);
    }

    .app-card:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: rgba(232, 182, 56, 0.55);
    }

    .app-icon-frame {
      width: 132px;
      height: 132px;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      border-radius: 16px;
      overflow: hidden;
      background: #081e20;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-icon-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .app-body {
      flex: 1;
      min-width: 0;
    }

    .app-name {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .app-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .app-btn {
      display: inline-block;
      background-color: var(--gold);
      color: #091d1f;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 7px;
      transition: filter 0.2s ease;
    }

    .app-card:hover .app-btn {
      filter: brightness(1.07);
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0.65;
      text-align: center;
    }

    @media (max-width: 860px) {
      .hub-container {
        flex-direction: column;
        gap: 18px;
      }

      .brand-panel,
      .apps-panel {
        width: 100%;
        max-width: 520px;
      }

      .branch-connector {
        display: none;
      }
    }

    @media (max-width: 520px) {
      .app-card {
        flex-direction: column;
        text-align: center;
        padding: 20px;
      }

      .app-icon-frame {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
<body>

  <main class="hub-container">
    <section class="brand-panel">
      <div class="brand-logo-frame">
        <img src="logoDigitalUmmah.jpg" alt="DigitalUmmah Logo">
      </div>
      <h1 class="brand-title">
        <span class="gold">Digital</span><span class="white">Ummah</span>
      </h1>
      <p class="brand-subtitle">Portal software muslim Modern</p>
    </section>

    <div class="branch-connector" aria-hidden="true">
      <svg viewBox="0 0 84 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Cabang atas ke Jam Shalat -->
        <path d="M 10 110 L 34 110 L 52 54 L 74 54" stroke="#e8b638" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="10" cy="110" r="4" fill="#e8b638"/>
        <circle cx="74" cy="54" r="4" fill="#e8b638"/>

        <!-- Cabang bawah ke Al-Qur'an -->
        <path d="M 10 110 L 34 110 L 52 166 L 74 166" stroke="#2b8a85" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="74" cy="166" r="4" fill="#2b8a85"/>
      </svg>
    </div>

    <section class="apps-panel">
      <a href="jam-shalat/" class="app-card">
        <div class="app-icon-frame">
          <img src="LogoJam.jpg" alt="Jam Shalat Digital">
        </div>
        <div class="app-body">
          <div class="app-name">Jam Shalat Digital</div>
          <p class="app-desc">Jadwal shalat akurat, tampilan jam analog, dan pengingat adzan.</p>
          <span class="app-btn">Lihat Aplikasi</span>
        </div>
      </a>

      <a href="al-quran/" class="app-card">
        <div class="app-icon-frame">
          <img src="LogoAlquran.jpg" alt="Al-Qur'an Digital">
        </div>
        <div class="app-body">
          <div class="app-name">Al-Qur'an Digital</div>
          <p class="app-desc">Bacaan per surah, terjemahan, catatan kaki, dan bookmark cepat.</p>
          <span class="app-btn">Mulai Membaca</span>
        </div>
      </a>
    </section>
  </main>

  <footer>
    © RadigaSoft. All rights reserved.
  </footer>

</body>
</html>
