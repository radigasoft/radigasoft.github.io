<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadigaSoft - Official Hub</title>
    <style>
        :root {
            --bg-color: #1a1a1d;
            --card-bg: #252529;
            --accent-color: #fa5c5c;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333338;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Container Logo Rasio 4:3 */
        .logo-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #151517;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-placeholder {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        /* Badge Under Construction ala itch.io */
        .status-badge {
            display: inline-block;
            background-color: rgba(250, 92, 92, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Box Gambar Logo (Ratio 4:3) -->
        <div class="logo-box">
            <!-- Lu bisa ganti src dibawah pake URL logo lu nanti -->
            <!-- <img src="logo.png" alt="RadigaSoft Logo"> -->
            <span class="logo-placeholder">LOGOMARK (4:3)</span>
        </div>

        <!-- Tag Status -->
        <div class="status-badge">🚧 Under Construction</div>

        <h1>RadigaSoft</h1>
        <p>Software distribution hub & indie project showcase.</p>
    </div>

    <footer>
        &copy; RadigaSoft. All rights reserved.
    </footer>

</body>
</html>
