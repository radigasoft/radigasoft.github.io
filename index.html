<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigitalUmmah - Portal Software Muslim Modern</title>
  <style>
    :root {
      --bg-dark: #051619;
      --bg-mid: #082026;
      --bg-glow: #0c2e35;
      --frame-bg: #082026;
      --card-bg: #082026;
      --card-hover: #0d2b32;
      --border-soft: #1a4750;
      --gold: #e8b638;
      --teal: #2b8a85;
      --text-main: #f3f7f7;
      --text-muted: #96b2b4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-mid);
      background-image:
        radial-gradient(circle at 35% 50%, var(--bg-glow) 0%, var(--bg-mid) 50%, var(--bg-dark) 100%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 36px 24px;
    }

    .hub-container {
      width: 100%;
      max-width: 1040px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .brand-panel {
      flex-shrink: 0;
      background: #082026;
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 12px 30px rgba(3, 12, 13, 0.35);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo-frame {
      display: block;
      width: fit-content;
      max-width: 100%;
      background-color: #082026;
      line-height: 0;
    }

    .brand-logo-frame img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
    }

    .brand-footer {
      width: 100%;
      padding: 12px 16px;
      background-color: #082026;
    }

    .brand-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .branch-connector {
      width: 84px;
      height: 220px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .branch-connector svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .apps-panel {
      flex: 1;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-card {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #082026;
      background-color: #082026;
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      padding: 0;
      padding-right: 22px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 12px 30px rgba(3, 12, 13, 0.35);
    }

    .app-card:hover {
      transform: translateY(-2px);
      background: #0d2b32;
      background-color: #0d2b32;
      border-color: rgba(232, 182, 56, 0.55);
    }

    .app-icon-frame {
      display: block;
      width: fit-content;
      flex-shrink: 0;
      background-color: #082026;
      line-height: 0;
    }

    .app-icon-frame img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
    }

    .app-body {
      flex: 1;
      min-width: 0;
      padding: 16px 0;
      background-color: transparent;
    }

    .app-name {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .app-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .app-btn {
      display: inline-block;
      background-color: var(--gold);
      color: #082026;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 15px;
      border-radius: 7px;
      transition: filter 0.2s ease;
    }

    .app-card:hover .app-btn {
      filter: brightness(1.07);
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0.65;
      text-align: center;
    }

    @media (max-width: 860px) {
      .hub-container {
        flex-direction: column;
        gap: 18px;
      }

      .brand-panel,
      .apps-panel {
        width: 100%;
        max-width: 520px;
      }

      .branch-connector {
        display: none;
      }
    }

    @media (max-width: 520px) {
      .app-card {
        flex-direction: column;
        text-align: center;
        padding-right: 0;
      }

      .app-body {
        padding: 16px 20px 20px;
      }
    }
  </style>
</head>
<body>

  <main class="hub-container">
    <section class="brand-panel">
      <div class="brand-logo-frame">
        <img src="logoDigitalUmmah.jpg" alt="DigitalUmmah Logo">
      </div>
      <div class="brand-footer">
        <p class="brand-subtitle">Portal software muslim Modern</p>
      </div>
    </section>

    <div class="branch-connector" aria-hidden="true">
      <svg viewBox="0 0 84 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 10 110 L 34 110 L 52 54 L 74 54" stroke="#e8b638" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="10" cy="110" r="4" fill="#e8b638"/>
        <circle cx="74" cy="54" r="4" fill="#e8b638"/>

        <path d="M 10 110 L 34 110 L 52 166 L 74 166" stroke="#2b8a85" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="74" cy="166" r="4" fill="#2b8a85"/>
      </svg>
    </div>

    <section class="apps-panel">
      <a href="jam-shalat/" class="app-card">
        <div class="app-icon-frame">
          <img src="LogoJam.jpg" alt="Jam Shalat Digital">
        </div>
        <div class="app-body">
          <div class="app-name">Jam Shalat Digital</div>
          <p class="app-desc">Jadwal shalat akurat, tampilan jam analog, dan pengingat adzan.</p>
          <span class="app-btn">Lihat Aplikasi</span>
        </div>
      </a>

      <a href="al-quran/" class="app-card">
        <div class="app-icon-frame">
          <img src="LogoAlquran.jpg" alt="Al-Qur'an Digital">
        </div>
        <div class="app-body">
          <div class="app-name">Al-Qur'an Digital</div>
          <p class="app-desc">Bacaan per surah, terjemahan, catatan kaki, dan bookmark cepat.</p>
          <span class="app-btn">Mulai Membaca</span>
        </div>
      </a>
    </section>
  </main>

  <footer>
    © RadigaSoft. All rights reserved.
  </footer>

</body>
</html>
