<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RadigaSoft - Software Hub & Indie Projects</title>
  <style>
    :root {
      --bg-color: #121316;
      --card-bg: #1c1e22;
      --border-color: #2e323b;
      --text-main: #f0f2f5;
      --text-muted: #9aa0a6;
      --accent: #e74c3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    /* KOTAK CONTAINER 1:1 PERSEGI FULL */
    .logo-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      margin-bottom: 24px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    /* GAMBAR FULL NGEPAS KOTAK */
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      display: inline-block;
      background-color: rgba(231, 76, 60, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.5;
    }

    footer {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-muted);
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- LOGO CONTAINER 1:1 -->
    <div class="logo-box">
      <img src="logo.jpg" alt="RadigaSoft Logo">
    </div>

    <!-- STATUS BADGE -->
    <div class="badge">
      🧱 Under Construction
    </div>

    <!-- BRANDING -->
    <h1>RadigaSoft</h1>
    <p>Software distribution hub & indie project showcase.</p>
  </div>

  <footer>
    &copy; RadigaSoft. All rights reserved.
  </footer>

</body>
</html>
